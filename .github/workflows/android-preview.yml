name: Publish myWik Android preview 0.10.0

on:
  push:
    branches: [release/preview-0.10.0]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '44561998452'
      BUILD_SHA: '17ab6e78b04754c8593ce310cb1307cdc1c804a1'
      TARGET_SHA: '603fed07ae56a56f65bce5124a1eafe036120819'
      APK_SHA: '80535b697ec6a8d92d18a4214e47829fe4e4a13d51940fe512f5420bc3fa5abd'
      TAG: v0.10.0-preview
      ASSET: myWik-0.10.0-Samsung.apk
    steps:
      - name: Verify release commit and retrieve the tested build
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$TARGET_SHA"
          gh run view "$BUILD_RUN" --json conclusion,headSha |
            jq -e --arg sha "$BUILD_SHA" '.conclusion == "success" and .headSha == $sha'
          gh run download "$BUILD_RUN" --name mywik-android-test-apk --dir verified
          mv verified/app-release.apk "$ASSET"
          printf '%s  %s\n' "$APK_SHA" "$ASSET" | sha256sum -c -
          gh api "repos/$GH_REPO/contents/docs/RELEASE-0.10.0.md?ref=$TARGET_SHA" --jq .content |
            base64 --decode > release-notes.md
          test -s release-notes.md
      - name: Publish a verified asset to the app update channel
        run: |
          if tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            test "$tag_sha" = "$TARGET_SHA"
          fi
          if ! gh release view "$TAG" --json isDraft,targetCommitish,assets > release.json; then
            gh release create "$TAG" --draft --prerelease --target "$TARGET_SHA" \
              --title 'myWik 0.10.0 für Android' --notes-file release-notes.md
            gh release view "$TAG" --json isDraft,targetCommitish,assets > release.json
          fi
          jq -e --arg target "$TARGET_SHA" '.isDraft and .targetCommitish == $target' release.json
          if ! jq -e --arg asset "$ASSET" '.assets | any(.name == $asset)' release.json; then
            gh release upload "$TAG" "$ASSET"
          fi
          gh release download "$TAG" --pattern "$ASSET" --output verify-upload.apk
          printf '%s  %s\n' "$APK_SHA" verify-upload.apk | sha256sum -c -
          gh release edit "$TAG" --draft=false
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$TARGET_SHA"

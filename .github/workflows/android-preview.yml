name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [feat/first-learning-app]
    paths:
      - .github/workflows/android-preview.yml
      - App.tsx
      - app.json
      - package-lock.json
      - src/**

permissions:
  contents: read

jobs:
  apk:
    name: Build Android preview (test signing)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Give preview its own application identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.name = 'myWik Preview';
          config.expo.android.package = 'de.mywik.app.preview';
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          NODE
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Verify test signing and embedded JavaScript build
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          const release = gradle.match(/release\s*\{([^}]+)/)?.[1] ?? '';
          if (!release.includes('signingConfig signingConfigs.debug')) {
            throw new Error('Preview workflow requires the Expo template test signing configuration. Review native template before building.');
          }
          if (!fs.existsSync('android/app/debug.keystore')) {
            throw new Error('Expo template test keystore missing.');
          }
          if (!gradle.includes('bundleCommand = "export:embed"') || /debuggableVariants\s*=\s*\[[^\]]*["']release["']/.test(gradle)) {
            throw new Error('Release must embed JavaScript and run without Metro.');
          }
          NODE
      - name: Install SDK required by Expo SDK 58 / React Native 0.88
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.30.5"
          # Google publishes API 37 with its minor version; RN resolves android-37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build self-contained ARM64 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=false -Porg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
      - uses: actions/upload-artifact@v4
        with:
          name: mywik-android-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

